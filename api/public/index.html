<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wurmpedia DB Viewer</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body { margin: 0; background: #0b0c10; color: #e8e8e8; }
    header { padding: 12px 16px; border-bottom: 1px solid #222; display:flex; gap:12px; align-items:center; }
    header h1 { font-size: 16px; margin: 0; opacity: .9; }
    header .pill { font-size: 12px; padding: 4px 8px; border: 1px solid #2a2a2a; border-radius: 999px; opacity:.9; }
    .wrap { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 52px); }
    .left { border-right: 1px solid #222; display:flex; flex-direction:column; min-width: 280px; }
    .right { padding: 16px; overflow:auto; }
    .controls { padding: 12px; border-bottom: 1px solid #222; display:flex; gap:8px; flex-wrap:wrap; }
    input[type="search"] { flex: 1; min-width: 180px; padding: 10px 10px; border-radius: 10px; border: 1px solid #2a2a2a; background:#0f1117; color:#e8e8e8; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid #2a2a2a; background:#111827; color:#e8e8e8; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .list { overflow:auto; padding: 6px; }
    .item { padding: 10px 10px; border-radius: 10px; border: 1px solid transparent; cursor:pointer; }
    .item:hover { background:#0f1117; border-color:#262626; }
    .item.active { background:#111827; border-color:#334155; }
    .item .title { font-weight: 600; font-size: 14px; }
    .item .meta { font-size: 12px; opacity:.7; margin-top: 2px; }
    .hint { opacity:.7; font-size: 13px; padding: 12px; }
    .grid { display:grid; grid-template-columns: 320px 1fr; gap: 16px; align-items:start; }
    .card { border: 1px solid #222; border-radius: 14px; padding: 12px; background:#0f1117; }
    .card h2 { margin: 0 0 8px 0; font-size: 14px; opacity:.9; }
    .kv { display:flex; justify-content:space-between; gap: 12px; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #222; }
    .kv:last-child { border-bottom: 0; }
    .tag { display:inline-block; font-size: 12px; padding: 4px 8px; border: 1px solid #2a2a2a; border-radius: 999px; margin: 4px 6px 0 0; opacity:.85; }
    .section { margin-bottom: 16px; }
    .section h3 { margin: 0 0 6px 0; font-size: 14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New"; font-size: 12px; white-space: pre-wrap; }
    img { max-width: 100%; border-radius: 12px; border: 1px solid #222; background:#0b0c10; }
    a { color: #93c5fd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .small { font-size: 12px; opacity:.7; }
    .error { color: #fecaca; }
    .tab-btn { background:#0b0c10; border-color:#333; }
    .tab-btn.active { background:#1e3a5f; border-color:#3b82f6; }
    .compare-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .compare-col { border:1px solid #333; border-radius:10px; padding:12px; background:#0f1117; }
    .compare-col h3 { margin:0 0 10px 0; font-size:14px; color:#93c5fd; }
    .match { color: #86efac; }
    .mismatch { color: #fecaca; background:#3b1515; padding:2px 4px; border-radius:4px; }
    .material-row { display:flex; gap:8px; padding:6px 0; border-bottom:1px dashed #222; font-size:13px; }
    .material-row:last-child { border-bottom:0; }
    .qty { min-width:50px; color:#93c5fd; }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:12px; margin-bottom:16px; }
    .stat-card { background:#111827; border:1px solid #222; border-radius:10px; padding:12px; text-align:center; }
    .stat-card .num { font-size:24px; font-weight:bold; color:#60a5fa; }
    .stat-card .lbl { font-size:12px; opacity:.7; }
    @media (max-width: 768px) {
      .wrap { grid-template-columns: 1fr; }
      .left { border-right: none; border-bottom: 1px solid #222; max-height: 40vh; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Wurmpedia DB Viewer</h1>
    <span class="pill" id="apiPill">API: ...</span>
    <span class="pill" id="statusPill">status: idle</span>
    <div style="flex:1"></div>
    <button id="tabPages" class="tab-btn active">Pages</button>
    <button id="tabRecipes" class="tab-btn">Recipes DB</button>
  </header>

  <div class="wrap">
    <aside class="left">
      <div class="controls">
        <input id="q" type="search" placeholder="Zoek... (bv: barrel, plank, sword)" />
        <button id="btnSearch">Search</button>
      </div>

      <div class="hint">
        Tip: type iets en druk Enter. Klik een resultaat om de infobox + sections te zien.
      </div>

      <div class="list" id="list"></div>
    </aside>

    <main class="right">
      <div id="detail" class="hint">Selecteer links een item...</div>
    </main>
  </div>

  <script>
    const elQ = document.getElementById("q");
    const elList = document.getElementById("list");
    const elDetail = document.getElementById("detail");
    const elApiPill = document.getElementById("apiPill");
    const elStatus = document.getElementById("statusPill");
    const btnSearch = document.getElementById("btnSearch");

    // Check API health on load
    (async () => {
      try {
        const health = await fetch("/api/health").then(r => r.json());
        elApiPill.textContent = `API: ok (${health.pages_count} pages)`;
      } catch {
        elApiPill.textContent = "API: offline";
      }
    })();

    function setStatus(s) { elStatus.textContent = `status: ${s}`; }

    async function apiGet(path) {
      const r = await fetch(path);
      if (!r.ok) {
        const t = await r.text().catch(() => "");
        throw new Error(`HTTP ${r.status} for ${path}\n${t}`);
      }
      return r.json();
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function renderList(items) {
      elList.innerHTML = "";
      if (!items.length) {
        elList.innerHTML = `<div class="hint">Geen resultaten.</div>`;
        return;
      }
      for (const it of items) {
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.slug = it.slug;
        div.innerHTML = `
          <div class="title">${esc(it.title)}</div>
          <div class="meta">${esc(it.slug)} • ${esc(it.page_type)}</div>
        `;
        div.onclick = () => selectSlug(it.slug, div);
        elList.appendChild(div);
      }
    }

    function setActive(div) {
      for (const node of elList.querySelectorAll(".item")) node.classList.remove("active");
      if (div) div.classList.add("active");
    }

    function formatInfoboxField(field) {
      const items = field.items ?? [];
      if (!Array.isArray(items) || items.length === 0) return `<div class="small">—</div>`;

      return `
        <ul>
          ${items.map(x => {
            const raw = esc(x.raw ?? "");
            const links = Array.isArray(x.links) ? x.links : [];
            const linksHtml = links.length
              ? `<div class="small">links: ${links.map(l => `<a href="#" data-href="${esc(l.href)}">${esc(l.text || l.href)}</a>`).join(", ")}</div>`
              : "";
            return `<li>${raw}${linksHtml}</li>`;
          }).join("")}
        </ul>
      `;
    }

    async function selectSlug(slug, div) {
      setActive(div);
      setStatus("loading...");
      elDetail.innerHTML = `<div class="hint">Loading <b>${esc(slug)}</b>...</div>`;

      try {
        const [page, infobox, sections] = await Promise.all([
          apiGet(`/api/pages/${encodeURIComponent(slug)}`),
          apiGet(`/api/pages/${encodeURIComponent(slug)}/infobox`),
          apiGet(`/api/pages/${encodeURIComponent(slug)}/sections`)
        ]);

        const crumbs = (() => {
          try {
            const bj = page.breadcrumbs_json;
            if (!bj) return [];
            if (Array.isArray(bj)) return bj;
            return JSON.parse(bj);
          } catch { return []; }
        })();

        const img = infobox?.image_original || infobox?.image_src || "";
        const imgHtml = img ? `<img src="${esc(img)}" alt="${esc(infobox?.image_alt || page.title)}" />` : "";

        const infoboxFields = infobox?.fields || [];

        const sectionsHtml = (sections || []).map(s => `
          <div class="section card">
            <h3>${esc(s.heading)}</h3>
            <div class="small">#${esc(s.heading_id || "")}</div>
            <div style="margin-top:8px;">${esc(s.content_text || "").replaceAll("\n","<br/>")}</div>
          </div>
        `).join("");

        elDetail.innerHTML = `
          <div class="grid">
            <div class="card">
              <h2>${esc(page.title)}</h2>
              <div class="small mono">${esc(page.slug)} • type=${esc(page.page_type)} • article_id=${esc(page.article_id)} • rev=${esc(page.revision_id)}</div>

              ${crumbs.length ? `<div style="margin-top:10px;">
                ${crumbs.map(c => `<span class="tag">${esc(c)}</span>`).join("")}
              </div>` : ""}

              <div style="margin-top:12px;">${imgHtml}</div>

              <div style="margin-top:12px;">
                <div class="kv"><span>Infobox</span><span>${infobox ? "yes" : "no"}</span></div>
                <div class="kv"><span>Fields</span><span>${esc(infoboxFields.length)}</span></div>
              </div>
            </div>

            <div>
              <div class="card">
                <h2>Infobox fields</h2>
                ${infoboxFields.length ? infoboxFields.map(f => `
                  <div class="section">
                    <h3>${esc(f.section_name)}</h3>
                    ${formatInfoboxField(f)}
                  </div>
                `).join("") : `<div class="hint">Geen infobox gevonden.</div>`}
              </div>

              <div style="height:12px"></div>

              <div class="card">
                <h2>Body sections</h2>
                ${sectionsHtml || `<div class="hint">Geen sections gevonden.</div>`}
              </div>

              <div style="height:12px"></div>

              <div class="card">
                <h2>Debug raw</h2>
                <div class="mono">${esc(JSON.stringify({page, infobox, sections}, null, 2))}</div>
              </div>
            </div>
          </div>
        `;

        elDetail.querySelectorAll('a[data-href]').forEach(a => {
          a.addEventListener('click', (e) => {
            e.preventDefault();
            const href = a.getAttribute('data-href');
            // Navigate to the linked page if it's a wiki link
            const slug = href.replace(/^\/wiki\//, "").replace(/^\//, "");
            if (slug) {
              elQ.value = slug;
              doSearch();
            }
          });
        });

        setStatus("ready");
      } catch (err) {
        console.error(err);
        elDetail.innerHTML = `
          <div class="card">
            <h2 class="error">Error</h2>
            <div class="mono error">${esc(err.message || String(err))}</div>
            <div class="hint">Check of de API draait op dezelfde origin.</div>
          </div>
        `;
        setStatus("error");
      }
    }

    async function searchPages() {
      const q = elQ.value.trim();
      if (!q) return;
      setStatus("searching...");
      btnSearch.disabled = true;
      try {
        const items = await apiGet(`/api/search?q=${encodeURIComponent(q)}`);
        renderList(items);
        setStatus(`results: ${items.length}`);
      } catch (e) {
        console.error(e);
        elList.innerHTML = `<div class="hint error">Search error: ${esc(e.message)}</div>`;
        setStatus("error");
      } finally {
        btnSearch.disabled = false;
      }
    }

    // ============================================
    // RECIPES TAB
    // ============================================

    const tabPages = document.getElementById("tabPages");
    const tabRecipes = document.getElementById("tabRecipes");
    let currentTab = "pages";

    function setTab(tab) {
      currentTab = tab;
      tabPages.classList.toggle("active", tab === "pages");
      tabRecipes.classList.toggle("active", tab === "recipes");
      elQ.value = "";
      elList.innerHTML = "";
      elDetail.innerHTML = `<div class="hint">Selecteer links een item...</div>`;

      if (tab === "recipes") {
        elQ.placeholder = "Zoek recept... (bv: large cart, sword)";
        loadRecipeStats();
      } else {
        elQ.placeholder = "Zoek... (bv: barrel, plank, sword)";
      }
    }

    tabPages.onclick = () => setTab("pages");
    tabRecipes.onclick = () => setTab("recipes");

    async function loadRecipeStats() {
      try {
        const stats = await apiGet("/api/recipes-stats");
        elDetail.innerHTML = `
          <div class="card">
            <h2>Recipes Database Statistics</h2>
            <div class="stats-grid">
              <div class="stat-card"><div class="num">${stats.items}</div><div class="lbl">Items</div></div>
              <div class="stat-card"><div class="num">${stats.materials}</div><div class="lbl">Materials</div></div>
              <div class="stat-card"><div class="num">${stats.tools}</div><div class="lbl">Tools</div></div>
              <div class="stat-card"><div class="num">${stats.linked_materials}</div><div class="lbl">Linked Materials</div></div>
              <div class="stat-card"><div class="num">${stats.linked_tools}</div><div class="lbl">Linked Tools</div></div>
            </div>
            <h3>Top Skills</h3>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              ${stats.skills.map(s => `<span class="tag">${esc(s.skill)} (${s.count})</span>`).join("")}
            </div>
          </div>
        `;
      } catch (err) {
        elDetail.innerHTML = `<div class="card"><div class="error">Error loading stats: ${esc(err.message)}</div><div class="hint">Run <code>node migrate-recipes.js</code> first to populate the recipes database.</div></div>`;
      }
    }

    async function searchRecipes() {
      const q = elQ.value.trim();
      if (!q) {
        loadRecipeStats();
        return;
      }
      setStatus("searching recipes...");
      btnSearch.disabled = true;
      try {
        const data = await apiGet(`/api/recipes?q=${encodeURIComponent(q)}&limit=50`);
        renderRecipeList(data.items);
        setStatus(`recipes: ${data.items.length}/${data.total}`);
      } catch (e) {
        console.error(e);
        elList.innerHTML = `<div class="hint error">Search error: ${esc(e.message)}</div>`;
        setStatus("error");
      } finally {
        btnSearch.disabled = false;
      }
    }

    function renderRecipeList(items) {
      elList.innerHTML = "";
      if (!items.length) {
        elList.innerHTML = `<div class="hint">Geen recipes gevonden.</div>`;
        return;
      }
      for (const it of items) {
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.slug = it.slug;
        div.innerHTML = `
          <div class="title">${esc(it.name)}</div>
          <div class="meta">${esc(it.skill || "—")} • ${it.material_count} mats • ${it.tool_count} tools</div>
        `;
        div.onclick = () => selectRecipe(it.slug, div);
        elList.appendChild(div);
      }
    }

    async function selectRecipe(slug, div) {
      setActive(div);
      setStatus("loading comparison...");
      elDetail.innerHTML = `<div class="hint">Loading comparison for <b>${esc(slug)}</b>...</div>`;

      try {
        const compare = await apiGet(`/api/recipes/${encodeURIComponent(slug)}/compare`);
        renderComparison(compare);
        setStatus("ready");
      } catch (err) {
        console.error(err);
        elDetail.innerHTML = `<div class="card error">Error: ${esc(err.message)}</div>`;
        setStatus("error");
      }
    }

    function renderComparison(data) {
      const db = data.database;
      const ib = data.infobox;

      const renderMaterials = (materials, isDb) => {
        if (!materials || materials.length === 0) return `<div class="small">—</div>`;
        return materials.map(m => {
          if (isDb) {
            // Format: "5x planks" or "1.5 kg iron lump"
            const qty = m.unit === 'kg' ? `${m.quantity} kg` : `${Math.round(m.quantity)}x`;
            return `<div class="material-row"><span class="qty">${qty}</span><span>${esc(m.material_name)}</span></div>`;
          } else {
            return `<div class="material-row"><span>${esc(m.raw || JSON.stringify(m))}</span></div>`;
          }
        }).join("");
      };

      const renderTools = (tools, isDb) => {
        if (!tools || tools.length === 0) return `<div class="small">—</div>`;
        return tools.map(t => {
          if (isDb) {
            return `<div class="material-row"><span>${esc(t.tool_name)}${t.is_workstation ? ' (workstation)' : ''}</span></div>`;
          } else {
            return `<div class="material-row"><span>${esc(t.raw || JSON.stringify(t))}</span></div>`;
          }
        }).join("");
      };

      const skillMatch = db?.skill === ib?.skill || (!db?.skill && !ib?.skill);

      elDetail.innerHTML = `
        <div class="card" style="margin-bottom:16px;">
          <h2>${esc(data.slug)}</h2>
          <div class="small">Vergelijk de geconverteerde database met de originele infobox data</div>
        </div>

        <div class="compare-grid">
          <div class="compare-col">
            <h3>Database (geconverteerd)</h3>
            ${db ? `
              <div class="section">
                <div class="kv"><span>Name</span><span>${esc(db.name)}</span></div>
                <div class="kv"><span>Skill</span><span class="${skillMatch ? 'match' : 'mismatch'}">${esc(db.skill || "—")}</span></div>
                <div class="kv"><span>Difficulty</span><span>${esc(db.difficulty || "—")}</span></div>
                <div class="kv"><span>Time</span><span>${db.time_seconds ? db.time_seconds + 's' : "—"}</span></div>
              </div>
              <h4 style="margin:12px 0 6px 0;">Materials (${db.materials?.length || 0})</h4>
              ${renderMaterials(db.materials, true)}
              <h4 style="margin:12px 0 6px 0;">Tools (${db.tools?.length || 0})</h4>
              ${renderTools(db.tools, true)}
              <h4 style="margin:12px 0 6px 0;">Categories</h4>
              <div>${db.categories?.map(c => `<span class="tag">${esc(c)}</span>`).join("") || "—"}</div>
            ` : `<div class="hint">Niet in recipes database</div>`}
          </div>

          <div class="compare-col">
            <h3>Infobox (origineel)</h3>
            ${ib ? `
              <div class="section">
                <div class="kv"><span>Name</span><span>${esc(ib.name)}</span></div>
                <div class="kv"><span>Skill</span><span class="${skillMatch ? 'match' : 'mismatch'}">${esc(ib.skill || "—")}</span></div>
                <div class="kv"><span>Difficulty</span><span>${esc(ib.difficulty || "—")}</span></div>
                <div class="kv"><span>Time</span><span>${esc(ib.time || "—")}</span></div>
              </div>
              <h4 style="margin:12px 0 6px 0;">Materials (${ib.materials?.length || 0})</h4>
              ${renderMaterials(ib.materials, false)}
              <h4 style="margin:12px 0 6px 0;">Tools (${ib.tools?.length || 0})</h4>
              ${renderTools(ib.tools, false)}
              <h4 style="margin:12px 0 6px 0;">All Fields</h4>
              <details>
                <summary class="small" style="cursor:pointer;">Toon alle infobox velden</summary>
                <div class="mono" style="margin-top:8px; font-size:11px; max-height:300px; overflow:auto;">${esc(JSON.stringify(ib.allFields, null, 2))}</div>
              </details>
            ` : `<div class="hint">Geen infobox gevonden</div>`}
          </div>
        </div>
      `;
    }

    // Search based on active tab
    async function doSearch() {
      if (currentTab === "recipes") {
        await searchRecipes();
      } else {
        await searchPages();
      }
    }

    btnSearch.addEventListener("click", doSearch);
    elQ.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch();
    });

    // Auto-demo
    elQ.value = "barrel";
    doSearch();
  </script>
</body>
</html>
