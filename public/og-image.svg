<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="200" fill="#6366f1" opacity="0.1"/>
  <circle cx="100" cy="530" r="150" fill="#8b5cf6" opacity="0.1"/>

  <!-- Logo/Icon area -->
  <g transform="translate(600, 200)">
    <!-- Anvil/Hammer icon -->
    <path d="M-60 -40 L60 -40 L50 0 L-50 0 Z" fill="url(#accent)" opacity="0.9"/>
    <rect x="-8" y="0" width="16" height="60" fill="url(#accent)" opacity="0.8"/>
    <path d="M-40 60 L40 60 L35 80 L-35 80 Z" fill="url(#accent)" opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Wurm Tools
  </text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a1a1aa" text-anchor="middle">
    Community Hub for Wurm Online
  </text>

  <!-- Features bar -->
  <g transform="translate(600, 480)">
    <text x="-300" y="0" font-family="system-ui, sans-serif" font-size="18" fill="#6366f1" text-anchor="middle">Crafting</text>
    <text x="-150" y="0" font-family="system-ui, sans-serif" font-size="18" fill="#6366f1" text-anchor="middle">Cooking</text>
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="18" fill="#6366f1" text-anchor="middle">Skills</text>
    <text x="150" y="0" font-family="system-ui, sans-serif" font-size="18" fill="#6366f1" text-anchor="middle">Market</text>
    <text x="300" y="0" font-family="system-ui, sans-serif" font-size="18" fill="#6366f1" text-anchor="middle">Community</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
