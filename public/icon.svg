<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Hammer -->
  <g transform="translate(96, 96)">
    <!-- Handle -->
    <rect x="-6" y="20" width="12" height="55" rx="2" fill="#fbbf24" opacity="0.9"/>

    <!-- Hammer Head -->
    <rect x="-30" y="-15" width="60" height="30" rx="3" fill="#f8fafc"/>
    <rect x="-30" y="-12" width="60" height="24" rx="2" fill="#e2e8f0"/>

    <!-- Hammer Detail Lines -->
    <line x1="-25" y1="-8" x2="-25" y2="8" stroke="#94a3b8" stroke-width="2"/>
    <line x1="-15" y1="-8" x2="-15" y2="8" stroke="#94a3b8" stroke-width="2"/>
    <line x1="15" y1="-8" x2="15" y2="8" stroke="#94a3b8" stroke-width="2"/>
    <line x1="25" y1="-8" x2="25" y2="8" stroke="#94a3b8" stroke-width="2"/>

    <!-- Spark/Impact Effect -->
    <circle cx="35" cy="-20" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="42" cy="-12" r="2" fill="#f59e0b" opacity="0.7"/>
    <circle cx="38" cy="-28" r="2" fill="#fbbf24" opacity="0.6"/>
  </g>
</svg>
